name: workflow.yml
on:
    push:
        branches:
            - main
            - feat/prisma

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v3
              with:
                  version: 9

            - run: pnpm --version
            - run: pnpm install
            - run: pnpm run test